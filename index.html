<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#570A34" />
    <meta name="color-scheme" content="light" />
    <!-- A family invitation should not appear in search engines. Link previews still work. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="format-detection" content="telephone=no" />
    <!--security-policy-->
    <!--social-meta-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="preload"
      href="/src/assets/fonts/cinzel-decorative-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/cormorant-garamond-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Shown for the first moment, before the invitation itself has loaded. */
      html,
      body {
        margin: 0;
        background: #570a34;
      }
      .boot {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #570a34;
        color: #ffe3be;
        font-family: Georgia, 'Times New Roman', serif;
        text-align: center;
      }
      .boot-ring {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 1px solid rgba(255, 227, 190, 0.3);
        border-top-color: #ffe3be;
        animation: boot-spin 1.1s linear infinite;
      }
      .boot-text {
        margin-top: 22px;
        font-size: 13px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        opacity: 0.85;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-ring"></div>
        <div class="boot-text">Opening your invitation</div>
      </div>
    </div>
    <noscript>
      <div class="boot">
        <div class="boot-text">Please enable JavaScript to open this wedding invitation.</div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
