# Publishes the wedding website on GitHub Pages.
#
# One-time setup in the repository on github.com:
#   Settings -> Pages -> "Build and deployment" -> Source: GitHub Actions
#
# After that, every change pushed to the "main" branch rebuilds and republishes
# the website in about two minutes. You can also run it by hand from the
# "Actions" tab with "Run workflow".
#
# To switch on RSVP saving and the /admin dashboard, add two repository
# variables under Settings -> Secrets and variables -> Actions -> Variables:
#   VITE_SUPABASE_URL              your Supabase Project URL
#   VITE_SUPABASE_PUBLISHABLE_KEY  your Supabase publishable key (never the secret key)
# and run the workflow again.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Read the website address from GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # GitHub Pages has no rewrite rules, so /admin gets its own copy of the page,
      # and any other deep link falls back to the same page.
      - name: Make /admin and deep links work
        run: |
          mkdir -p dist/admin
          cp dist/index.html dist/admin/index.html
          cp dist/index.html dist/404.html

      - name: Upload the website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
